/* Layout: one study app — sticky top bar, hash-routed views (home → grade → subject → lesson/practice/exam), floating AI helper. Pastel stationery palette. */

}

  --mint:#5fd7a8; --mint-soft:#1d3a30; --sun:#ffc861; --sun-soft:#3d3218;

:root[data-theme="dark"]{

  --mint:#5fd7a8; --mint-soft:#1d3a30; --sun:#ffc861; --sun-soft:#3d3218;

*{box-sizing:border-box}

.lesson{border:1px solid var(--line);border-radius:18px;background:var(--surface);margin:10px 0;overflow:hidden}

.lesson > summary .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--lav-soft);color:var(--lav);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.lesson > summary .t{flex:1;min-width:0}
.lesson > summary .done{color:var(--mint)}
.lesson[open] > summary{border-bottom:1px dashed var(--line)}
.lesson .body{padding:12px 16px}
.lesson .body p{margin:6px 0}
.ex{background:var(--sky-soft);border-radius:14px;padding:10px 12px;margin:8px 0}
.trap{background:var(--sun-soft);border-radius:14px;padding:10px 12px;margin:8px 0}
.key{background:var(--pink-soft);border-radius:14px;padding:10px 12px;margin:8px 0}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:"Cambria Math","Segoe UI",serif;font-weight:600;color:var(--pink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.timer{font-variant-numeric:tabular-nums}
.res .big{font-family:var(--f-disp);font-size:56px;text-align:center;margin:0}

.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

[dir="ltr"] .fab{left:auto;right:calc(16px + env(safe-area-inset-right,0px))}

.tutor{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

.lfig{margin:16px auto;text-align:center;max-width:640px}
.lfig img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:zoom-in;box-shadow:0 4px 14px rgba(0,0,0,.06)}

/* ===== motion: page entrance, reveal on scroll, press feedback, celebration ===== */
@keyframes mthUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes mthPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes mthFly{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--rot));opacity:0}}
#view.vin>*{animation:mthUp .5s cubic-bezier(.2,.8,.2,1) both}
#view.vin>*:nth-child(2){animation-delay:.06s}#view.vin>*:nth-child(3){animation-delay:.12s}#view.vin>*:nth-child(4){animation-delay:.18s}#view.vin>*:nth-child(n+5){animation-delay:.22s}
.rv{opacity:0;transform:translateY(22px) scale(.98);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.rv.on{opacity:1;transform:none}
.tile{transition:transform .18s ease,box-shadow .2s ease}

.tile:active,button:active,.hbtn:active{transform:scale(.96)}
.fb.ok{animation:mthPop .45s ease both}
.mth-p{position:fixed;z-index:10000;pointer-events:none;font-size:22px;animation:mthFly .9s ease-out forwards}
@media (prefers-reduced-motion:reduce){#view.vin>*,.fb.ok,.mth-p{animation:none!important}.rv{opacity:1;transform:none;transition:none}.tile,.tile:hover{transition:none;transform:none}}
.tutor .msgs{min-height:240px;flex:1 1 auto}
/* chat fills the screen so the message box sits at the bottom, even with few messages */
.tutor{min-height:calc(100vh - 120px);min-height:calc(100dvh - 120px)}

.typing{display:inline-flex;gap:4px;padding:4px 0}
