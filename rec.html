<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>مذاكرتي · تسجيل الصوت</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ef5d98;--lav:#7b62e8;--mint:#1fa77a;--ink:#3b2531;--mut:#8c6a7a;--bg:#fff7fa;--line:#f6d3e1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;padding:16px 16px 140px;max-width:640px;margin:auto}
h1{font:800 26px "Baloo Bhaijaan 2",Tajawal;margin:6px 0 4px}h1 i{font-style:normal;color:var(--pink)}
.mut{color:var(--mut);font-size:15px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ad{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;text-align:right;font:800 17px Tajawal;cursor:pointer;color:var(--ink)}
.ad small{display:block;font:700 13px Tajawal;color:var(--mut);margin-top:4px}
.ad.done{border-color:var(--mint);background:#e9f9f1}
.ad.done small{color:var(--mint)}
#view{display:none}
.back{background:none;border:0;color:var(--lav);font:800 16px Tajawal;padding:6px 0;cursor:pointer}
.tip{background:#efeaff;border-radius:14px;padding:10px 14px;margin:10px 0;font:700 15px/1.6 Tajawal;color:#4b38b3}
.lines{margin:12px 0}
.ln{font:800 26px/1.5 "Baloo Bhaijaan 2",Tajawal;padding:12px 14px;border-radius:16px;margin:6px 0;background:#fff;border:2px solid var(--line);transition:all .25s}
.ln.who{font-size:22px}.ln b{color:var(--pink);font-size:18px;display:block}
.ln.cur{border-color:var(--pink);background:#ffe3ee;transform:scale(1.02)}
.ln.past{opacity:.45}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none}
#bar .in{max-width:640px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:14px 22px;font:800 18px Tajawal;cursor:pointer}
#rec{background:var(--pink);color:#fff;flex:1}
#rec.on{background:#d9435a;animation:pul 1s infinite}
@keyframes pul{50%{box-shadow:0 0 0 10px rgba(217,67,90,.15)}}
#next{background:#efeaff;color:#4b38b3}
#send{background:var(--mint);color:#fff;flex:1}
#again{background:#f4eef1;color:var(--ink)}
#time{font:800 18px Tajawal;color:var(--mut);min-width:54px;text-align:center}
audio{width:100%;margin-top:8px}
#msg{width:100%;font:700 15px Tajawal;text-align:center;min-height:1.4em}
.err{color:#d9435a}.ok{color:var(--mint)}
</style></head>
<body>
<div id="home">
  <h1>🎙️ تسجيل صوت إعلانات مذاكر<i>تي</i></h1>
  <p class="mut">اختاري الإعلان، اضغطي «سجّلي» واقري النص. اضغطي على أي جملة أو زر «الجملة الجاية» عشان تتلون الجملة اللي تقرينها. لما تخلصين اضغطي «أرسلي»، ويوصل الصوت مباشرة.</p>
  <div class="grid" id="grid"></div>
</div>
<div id="view">
  <button class="back" onclick="home()">→ رجوع للإعلانات</button>
  <h1 id="vt"></h1>
  <div class="tip" id="tipx"></div>
  <div class="lines" id="lines"></div>
  <audio id="play" controls style="display:none"></audio>
</div>
<div id="bar"><div class="in">
  <button class="btn" id="rec">🎙️ سجّلي</button><span id="time">0:00</span>
  <button class="btn" id="next">الجملة الجاية ⬇️</button>
  <button class="btn" id="again" style="display:none">↻ أعيد</button>
  <button class="btn" id="send" style="display:none">✅ أرسلي</button>
  <div id="msg"></div>
</div></div>
<script>
const FN='https://valzeoiilqbmmrosspsp.supabase.co/functions/v1/voice-rec';
const KEY=new URLSearchParams(location.search).get('k')||'';
const ADS=[
 [1,'العد التنازلي','بحماس، كأنج تنبهين صديقتج',['باقي عشر أيام على الامتحان، وما بديت؟','لا تشيل هم، مذاكرتي معاك.','دروس من ماتيريال مدرستك،','كويزات على هيكل الامتحان،','ومدرس خصوصي يرد عليك.','تنافس طلاب صفك في كل الإمارات،','وأول واحد يوصل خمسمية نقطة، يفوز كل جمعة!','مذاكرتي، مجانًا.']],
 [2,'الماتيريال مبعثر','أول جملة متضايقة، وبعدين مرتاحة',['الماتيريال في كل مكان؟','خلّه علينا.','في مذاكرتي، كل مادة مرتبة درس درس.','على هيكل الامتحان، مع كويز بعد كل درس.','مذاكرتي، مجانًا.']],
 [3,'سباق الجمعة','حماس مثل معلّق مباراة',['حمد وصل أربعمية وثمانين نقطة، وأنت؟','هذا سباق الجمعة لصفك في كل الإمارات.','كل جواب صح، نقاط.','وأول واحد يوصل خمسمية، يفوز!','ادخل السباق مجانًا.']],
 [4,'شات الشلة','حوار، تقدرين تسجلينه مع صديقاتج',['مهرة: منو خلّص يذاكر المول؟','أنتِ: أنا خلّصته!','ريم: من وين؟ الملفات وايد!','أنتِ: من مذاكرتي، على هيكل الامتحان.','مهرة: وفيه كويزات؟','أنتِ: إيه، وأنا الأولى في صفي!','ريم: عطيني اللينك!','مذاكرتي، جرّبه مجانًا.']],
 [5,'ذاكر أذكى','سريع وقوي',['ذاكر أذكى، مب أكثر.','خمسمية وخمسين درس.','ثلاث آلاف وستمية سؤال.','كل مواد صفك.','على هيكل الامتحان، ومع مدرس خصوصي.','مذاكرتي، مجانًا.']],
 [6,'درس في 15 ثانية','مثل المعلّمة، واضح وهادي',['كم حل للمعادلة التربيعية، بدون ما تحلها؟','شوف المميّز: بي تربيع ناقص أربعة إيه سي.','موجب؟ حلّين.','صفر؟ حل واحد.','سالب؟ ولا حل حقيقي.','هني المميز صفر، يعني حل واحد.','دروس مثلها في مذاكرتي.']],
 [7,'تحدي 5 ثواني','مثل مقدّمة برنامج مسابقات',['تحدي خمس ثواني!','ما إعراب «مجتهدٌ»؟','خمسة… أربعة… ثلاثة… اثنين… واحد (ثانية بين كل رقم)','خبر إنّ مرفوع!','إنّ تنصب الاسم وترفع الخبر.','جاوبت صح؟ علّق تحت.','آلاف الأسئلة في مذاكرتي.']],
 [8,'لأولياء الأمور','هادي ودافي، بدون استعجال',['ولدك يذاكر، بس من وين؟','مذاكرتي، منصة مجانية لطلاب الإمارات.','من ماتيريال المدرسة، وعلى هيكل الامتحان.','مكان واحد مرتّب، بدل عشرات الملفات.','شاركه مع ولدك اليوم.']],
 [9,'3 غلطات','نبرة نصيحة، وبثقة',['ثلاث غلطات تضيّع درجاتك.','ملخصات عشوائية.','ذاكر على الهيكل.','تقرا بس، وما تحل.','حل كويز بعد كل درس.','تأجل لليلة الامتحان.','ذاكر شوي كل يوم.','وكلها جاهزة في مذاكرتي.']],
 [10,'الساعة 2 الفجر','أول شي تعبانة ومتوترة، وبعد «تخيّل لو» مرتاحة',['الساعة اثنين الفجر، وباكر امتحان.','هذا داخل؟','وين الهيكل؟','خلاص، بحفظ كل شي.','تخيّل لو…','ربع ساعة كل يوم على مذاكرتي.','وليلة الامتحان؟ نايم.','لا تخليها لليلة الامتحان.']],
];
const $=id=>document.getElementById(id);
let done={};try{done=JSON.parse(localStorage.getItem('mthRecDone')||'{}')}catch(e){}
function grid(){$('grid').innerHTML=ADS.map(a=>`<button class="ad${done[a[0]]?' done':''}" onclick="openAd(${a[0]})">${a[0]}. ${a[1]}<small>${done[a[0]]?'✅ وصل':'لم يُسجَّل'}</small></button>`).join('')}
let cur=null,idx=0,mr=null,chunks=[],blob=null,stream=null,t0=0,tick=null;
function home(){stop(true);$('home').style.display='block';$('view').style.display='none';$('bar').style.display='none';grid();scrollTo(0,0)}
function openAd(n){cur=ADS.find(a=>a[0]===n);idx=0;blob=null;$('home').style.display='none';$('view').style.display='block';$('bar').style.display='block';
  $('vt').textContent=`${cur[0]}. ${cur[1]}`;$('tipx').textContent='🎭 النبرة: '+cur[2];
  $('lines').innerHTML=cur[3].map((l,i)=>{const m=l.match(/^(مهرة|ريم|أنتِ): (.*)$/);return `<div class="ln${m?' who':''}" onclick="setIdx(${i})">${m?`<b>${m[1]}</b>${m[2]}`:l}</div>`}).join('');
  $('play').style.display='none';reset();setIdx(0);scrollTo(0,0)}
function setIdx(i){idx=Math.max(0,Math.min(i,cur[3].length-1));[...document.querySelectorAll('.ln')].forEach((e,j)=>{e.classList.toggle('cur',j===idx);e.classList.toggle('past',j<idx)});
  const el=document.querySelectorAll('.ln')[idx];if(el)el.scrollIntoView({block:'center',behavior:'smooth'})}
function msg(t,c){$('msg').textContent=t;$('msg').className=c||''}
function reset(){$('rec').style.display='';$('next').style.display='';$('time').style.display='';$('again').style.display='none';$('send').style.display='none';$('rec').textContent='🎙️ سجّلي';$('rec').classList.remove('on');$('time').textContent='0:00';msg('')}
function pick(){const c=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];for(const x of c){try{if(MediaRecorder.isTypeSupported(x))return x}catch(e){}}return ''}
async function start(){
  if(!KEY){msg('الرابط ناقص المفتاح، افتحي الرابط اللي طرشته لج بالضبط','err');return}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}catch(e){msg('لازم تسمحين للمايك من إعدادات المتصفح 🎙️','err');return}
  const type=pick();mr=new MediaRecorder(stream,type?{mimeType:type,audioBitsPerSecond:128000}:undefined);chunks=[];
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{blob=new Blob(chunks,{type:mr.mimeType||type||'audio/webm'});$('play').src=URL.createObjectURL(blob);$('play').style.display='block';
    $('rec').style.display='none';$('next').style.display='none';$('again').style.display='';$('send').style.display='';msg('اسمعي التسجيل، وإذا عجبج اضغطي «أرسلي»')};
  mr.start(250);t0=Date.now();$('rec').textContent='⏹️ وقّفي';$('rec').classList.add('on');setIdx(0);msg('🔴 قاعد يسجل… اقري الجملة الملونة');
  tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}
function stop(silent){clearInterval(tick);if(mr&&mr.state!=='inactive'){if(silent)mr.onstop=null;mr.stop()}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
$('rec').onclick=()=>{if(mr&&mr.state==='recording')stop();else start()};
$('next').onclick=()=>setIdx(idx+1);
$('again').onclick=()=>{blob=null;$('play').style.display='none';reset();setIdx(0)};
$('send').onclick=async()=>{if(!blob)return;$('send').disabled=true;msg('⏳ قاعد يرسل…');
  try{const r=await fetch(`${FN}?k=${encodeURIComponent(KEY)}&ad=${cur[0]}`,{method:'POST',headers:{'content-type':blob.type||'audio/webm'},body:blob});const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok)throw new Error(j.error||r.status);
    done[cur[0]]=1;try{localStorage.setItem('mthRecDone',JSON.stringify(done))}catch(e){}
    msg('✅ وصل! تقدرين ترجعين وتسجلين الإعلان اللي بعده','ok');setTimeout(home,1600)}
  catch(e){msg('ما وصل ('+e.message+')، جربي مرة ثانية','err')}finally{$('send').disabled=false}};
grid();
</script>
</body></html>
